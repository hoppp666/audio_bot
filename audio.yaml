# Настройки автодобавления трендовых треков в музыку сообщества
# (скрипт vk_audio_bot.py, воркфлоу .github/workflows/audio.yml)

enabled: true
per_run: 12                 # сколько треков добавлять за один запуск
daily_limit: 50             # примерно 50 треков в сутки (по московскому времени):
                            # 5 запусков в день по 12 = до 60 слотов,
                            # дневной лимит 50 отсекает лишнее
min_duration: 60            # треки короче = рингтоны, отбрасываем
max_duration: 600           # дольше 10 минут - не трековый формат
use_popular: true           # сначала чарт «Популярное» (audio.getPopular)
rename_template: "{title} ({group})"   # как переименовывать трек
group_name: ""              # пусто = название берётся из VK автоматически

# Запросы для поиска трендового (audio.search, сортировка по популярности).
# Каждый запуск берёт их в случайном порядке - так за день набирается
# разнообразие и треки не повторяются между запусками. Обновляйте список
# раз в пару недель - это ваши "тренды" на будущее:
queries:
  - "новинки 2026"
  - "хиты чарта"
  - "top hits"
  - "pop chart"
  - "новая музыка"
  - "dance hits"
  - "rock hits"
  - "hip hop 2026"
  - "русские хиты"
  - "remix 2026"
  - "popular songs"
  - "mood music"
